name: assemble
on:
  push:
    paths:
      - '.parts/**'
      - '.github/workflows/assemble.yml'
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode exact parts
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          parts = sorted(Path('.parts').glob('*.b64'))
          assert [p.name for p in parts] == ['aa.b64','ab.b64','ac.b64','ad.b64','ae.b64','af.b64','ag.b64','ah.b64'], [p.name for p in parts]
          data = b''.join(base64.b64decode(p.read_text().strip()) for p in parts)
          Path('clone-build.sh').write_bytes(data)
          print(len(data), hashlib.sha256(data).hexdigest())
          if len(data) != 114900:
              raise SystemExit(f'size {len(data)}')
          PY
          chmod +x clone-build.sh
          git config user.name "assemble"
          git config user.email "assemble@users.noreply.github.com"
          git add clone-build.sh
          git diff --cached --quiet || git commit -m "Assemble clone-build.sh from exact disk parts"
          git push
