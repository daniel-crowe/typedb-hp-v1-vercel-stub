name: assemble
on:
  push:
    paths:
      - '.github/workflows/assemble.yml'
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact clone-build.sh
        run: |
          set -eu
          curl -fsSL -o clone-build.sh https://litter.catbox.moe/lgl4s7.sh
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          data = Path('clone-build.sh').read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          print(len(data), digest)
          if len(data) != 114900 or digest != 'f6c80c405aff85f8a9bc8961f80778af922f7a0c85f944524f339ade601dff4d':
              raise SystemExit('clone-build.sh does not match the on-disk file')
          PY
          chmod +x clone-build.sh
          git config user.name "assemble"
          git config user.email "assemble@users.noreply.github.com"
          git add clone-build.sh
          git diff --cached --quiet || git commit -m "Add exact clone-build.sh (114900 bytes)"
          git push
